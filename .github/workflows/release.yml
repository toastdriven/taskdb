name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify-compile-invocation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            artifact: taskdb-linux-x64
          - target: bun-linux-arm64
            artifact: taskdb-linux-arm64
          - target: bun-darwin-x64
            artifact: taskdb-darwin-x64
          - target: bun-darwin-arm64
            artifact: taskdb-darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup just
        uses: taiki-e/install-action@just

      - name: Verify compile command (dry-run)
        run: just --dry-run compile "${{ matrix.target }}" "./dist/${{ matrix.artifact }}"

  build-binaries:
    needs: verify-compile-invocation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            artifact: taskdb-linux-x64
          - target: bun-linux-arm64
            artifact: taskdb-linux-arm64
          - target: bun-darwin-x64
            artifact: taskdb-darwin-x64
          - target: bun-darwin-arm64
            artifact: taskdb-darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup just
        uses: taiki-e/install-action@just

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile
        run: just compile "${{ matrix.target }}" "./dist/${{ matrix.artifact }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./dist/${{ matrix.artifact }}

  publish-release:
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist

      - name: Flatten artifact directories
        run: |
          mkdir -p ./release
          find ./dist -type f -maxdepth 3 -exec cp {} ./release/ \;

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release/*
